[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md2share"
version = "0.1.0"
description = "Convert local Markdown into shareable HTML and PDF"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
highlight = ["Pygments>=2"]

[project.scripts]
md2share = "md2share:main"

[tool.setuptools]
py-modules = ["md2share"]
